<div class="flex-grid">
  @for ($img of images; track $img.id) {
    <div class="grid-img card" style="display: flex; flex-direction: column; align-items: center;margin: 0.5rem;">
      <img [src]="`${BASE_URL}/myimages/${$img.id}`" style="width: 100%;"/>
      <div style="display: flex; flex-direction: row; justify-content: space-between; width: 100%;">
        <p-button label="Predict" severity="primary" (onClick)="predict($img)"/>
        <p-button label="Delete" severity="danger" (onClick)="delete($img)"/>
      </div>
    </div>
  }
</div>

<p-fileupload name="file" url="{{BASE_URL}}/upload_image" [multiple]="false" accept="image/*"
              [withCredentials]="true"
              maxFileSize="1000000" (onUpload)="onTemplatedUpload()" (onSelect)="onSelectedFiles($event)">
  <ng-template #header let-files let-chooseCallback="chooseCallback" let-clearCallback="clearCallback"
               let-uploadCallback="uploadCallback">
    <div class="flex flex-wrap justify-between items-center flex-1 gap-4">
      <div class="flex gap-2">
        <p-button (onClick)="choose($event, chooseCallback)" icon="pi pi-images" [rounded]="true" [outlined]="true"/>
        <p-button (onClick)="uploadEvent(uploadCallback)" icon="pi pi-cloud-upload" [rounded]="true" [outlined]="true"
                  severity="success" [disabled]="!files || files.length === 0"/>
        <p-button (onClick)="clearCallback()" icon="pi pi-times" [rounded]="true" [outlined]="true" severity="danger"
                  [disabled]="!files || files.length === 0"/>
      </div>

    </div>
  </ng-template>
  <ng-template #content let-files let-uploadedFiles="uploadedFiles" let-removeFileCallback="removeFileCallback"
               let-removeUploadedFileCallback="removeUploadedFileCallback">
    <div class="flex flex-col gap-8 pt-4">
      <div *ngIf="files?.length > 0">
        <h5>Pending</h5>
        <div class="flex flex-wrap gap-4">
          <div *ngFor="let file of files; let i = index"
               class="p-8 rounded-border flex flex-col border border-surface items-center gap-4">
            <div>
              <img role="presentation" [alt]="file.name" [src]="file.objectURL" width="100" height="50"/>
            </div>
            <span class="font-semibold text-ellipsis max-w-60 whitespace-nowrap overflow-hidden">{{ file.name }}</span>
            <div>{{ file.size / 1000 | number:'1.0-1' }} KB</div>
            <p-badge value="Pending" severity="warn"/>
            <p-button icon="pi pi-times" (click)="onRemoveTemplatingFile($event, file, removeFileCallback, i)"
                      [outlined]="true" [rounded]="true" severity="danger"/>
          </div>
        </div>
      </div>
      <div *ngIf="uploadedFiles?.length > 0">
        <h5>Completed</h5>
        <div class="flex flex-wrap gap-4">
          <div *ngFor="let file of uploadedFiles; let i = index"
               class="card m-0 px-12 flex flex-col border border-surface items-center gap-4">
            <div>
              <img role="presentation" [alt]="file.name" [src]="file.objectURL" width="100" height="50"/>
            </div>
            <span class="font-semibold text-ellipsis max-w-60 whitespace-nowrap overflow-hidden">{{ file.name }}</span>
            <div>{{ file.size }}</div>
            <p-badge value="Completed" class="mt-4" severity="success"/>
            <p-button icon="pi pi-times" (onClick)="removeUploadedFileCallback(i)" [outlined]="true"
                      [rounded]="true" severity="danger"/>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
  <ng-template #file></ng-template>
  <ng-template #empty>
    <div class="flex items-center justify-center flex-col">
      <i class="pi pi-cloud-upload !border-2 !rounded-full !p-8 !text-4xl !text-muted-color"></i>
      <p class="mt-6 mb-0">Drag and drop files to here to upload.</p>
    </div>
  </ng-template>
</p-fileupload>
