
<div id="g_id_onload"
     data-client_id="YOUR_GOOGLE_CLIENT_ID"
     data-login_uri="https://your.domain/your_login_endpoint"
     data-auto_prompt="false">
</div>


<button (click)="login()">
  Login
</button>
<!--<div class="card flex justify-center">-->
<!--  <p-button label="Check" />-->
<!--</div>-->
<div>
  <p-dropdown
    [options]="categories"
    [(ngModel)]="selectedCategory"
    optionLabel="label"
    placeholder="Select a category"
    (onChange)="onCategoryChange()"
  />
</div>

<div class="flex-grid">
  @for($img of images;track $img.url)
  {
    <div class="grid-img" style="display: flex; flex-direction: column; align-items: center;">
      <img [src]="`${BASE_URL}${$img.url}`" class=""/>
      <p-button label="Predict" (onClick)="predict($img)" />
    </div>
  }
</div>
<p-paginator (onPageChange)="onPageChange($event)" [first]="first" [rows]="rows" [totalRecords]="imageCount.count" [rowsPerPageOptions]="[10, 25, 50]" />

<p-dialog header="Prediction report" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
  <div>
    Predicted mask:
  </div>
  <div>
    <img [src]="`${mask_url}`" class=""/>
  </div>
  <div>
    Prediction details
  </div>
  <div class="json" >
    <p>JSON</p>
    <pre>{{ json | json }}</pre>

  </div>
</p-dialog>
